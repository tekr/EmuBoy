name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Not ubuntu-latest: from Ubuntu 26.04 the distribution's SFML is 3.x, which Emu Boy doesn't support yet
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # The package mirror occasionally stalls, so time out and retry rather than hang
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo -E apt-get $APT_OPTS update
          sudo -E apt-get $APT_OPTS install -y --no-install-recommends libboost-dev libsfml-dev libgtest-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install boost sfml@2 googletest

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build
          -DSFML_DIR="$(brew --prefix sfml@2)/lib/cmake/SFML"
          -DCMAKE_PREFIX_PATH="$(brew --prefix boost);$(brew --prefix googletest)"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
